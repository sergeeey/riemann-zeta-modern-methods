hypothesis_card:
  id: "20260630-h12-next-mutation"
  date: "2026-06-30"
  project: "H-12 Riemann Hypothesis"
  decision_supported: "Choose the smallest next mutation that returns value after the RH research track was closed as a proof attempt."
  hypothesis: "H-12 should evolve from a RH-research project into a Skeptic Engine golden-set/case-study asset, not continue as a direct RH proof search."
  mechanism: "The project already contains verified examples of circularity, overclaim, tautology, numerical error, and self-audit failure; packaging these as an evidence-ready benchmark transfers value to the broader verification-engine project."
  baseline: "V0: pause / keep current repository as archived research notes."
  smallest_test: "Create one evidence-ready case-study packet from existing artifacts and verify that every catch has a source path, evidence label, baseline/negative-control note, and reproduction path."
  success_metric: "A reviewer can trace at least 8 of 11 catches from SKEPTIC-ENGINE-CASE.md to a concrete artifact without relying on narrative trust."
  minimum_practical_effect: "Produces a reusable golden-set seed for Skeptic Engine; avoids new RH proof claims."
  falsification_condition: "If catches cannot be traced to artifacts, or if the packet depends on unverified mathematical novelty claims, the mutation fails."
  negative_control: "Include at least one intentionally weak or merely illustrative catch and ensure it is labeled lower-severity rather than promoted as proof of engine value."
  adversarial_case: "A skeptical reviewer says the case is validation theater because author, skeptic, and reviewer were not fully independent."
  evidence_level: "[CODE] for project artifacts read; [INFERRED] for value-ranking; [NEEDS-REAL-DATA] for generalization beyond this one project."
  assumptions:
    - assumption: "Skeptic Engine manuscript or benchmark work is still an active downstream target."
      if_false: "The best next step becomes park/archive rather than package."
      test: "Check target repository or current project priorities before moving artifacts."
    - assumption: "Existing H-12 artifacts are sufficient to trace the 11 catches."
      if_false: "Run a traceability audit before any publication or benchmark claim."
      test: "Build a catch-to-artifact matrix and sample-check source files."
    - assumption: "The strongest value is methodology evidence, not mathematical novelty."
      if_false: "A literature-review or math-note path may outrank the case-study path."
      test: "Compare variants by evidence_gain and baseline_delta."
  reproduction_path: "evolution/20260630-evolve-solution/evidence_report.yaml plus SKEPTIC-ENGINE-CASE.md, SYNTHESIS.md, experiments/, null_results/."
  owner: "Sergey / Codex"
  next_action: "Build traceability matrix for the 11 catches, then transfer the packet to the Skeptic Engine manuscript only after the matrix passes review."
